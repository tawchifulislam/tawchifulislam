name: Generate Streak Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Streak Stats (Dark)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=tawchifulislam&theme=tokyonight&timezone=Asia/Dhaka
          path: github-streak-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats (Light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=tawchifulislam&theme=default&timezone=Asia/Dhaka
          path: github-streak-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        run: |
          mkdir -p /tmp/output-branch
          cp github-streak-stats-dark.svg github-streak-stats-light.svg /tmp/output-branch/
          cd /tmp/output-branch
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update streak stats" --allow-empty
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/tawchifulislam/tawchifulislam.git
          git push origin output --force
