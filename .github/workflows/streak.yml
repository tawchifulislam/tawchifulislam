name: Generate Streak Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Streak Stats (Dark)
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: tawchifulislam
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: tokyonight
          OUTPUT_PATH: github-streak-stats-dark.svg

      - name: Generate Streak Stats (Light)
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: tawchifulislam
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: default
          OUTPUT_PATH: github-streak-stats-light.svg

      - name: Push SVGs to output branch
        run: |
          mkdir -p /tmp/output-branch
          cp github-streak-stats-dark.svg github-streak-stats-light.svg /tmp/output-branch/
          cd /tmp/output-branch
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update streak stats"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/tawchifulislam/tawchifulislam.git
          git push origin output --force
